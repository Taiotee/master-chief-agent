name: Build Master Chief APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Make gradlew executable
        working-directory: master-chief-apk-clean/master-chief-apk
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: master-chief-apk-clean/master-chief-apk
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: master-chief-debug-apk
          path: master-chief-apk-clean/master-chief-apk/app/build/outputs/apk/debug/app-debug.apk
