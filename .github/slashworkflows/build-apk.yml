name: Build Master Chief APK

# Builds the debug APK in the cloud (GitHub Actions) — no computer
# with Android Studio needed. Push this project to a GitHub repo and
# the APK appears under the run's Artifacts as master-chief-debug-apk.
# Project: Gradle 8.7, Android Gradle Plugin 8.5.2, Kotlin 1.9.24, JDK 17.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: master-chief-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
