# Gradle properties — tuned for a 6 GB RAM build machine / phone target.
# On the OPPO A74 5G itself this file is irrelevant; it matters when building the APK.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# Keep R8 on for release: smaller APK matters on a 128 GB phone.
android.enableR8.fullMode=true
kotlin.code.style=official
